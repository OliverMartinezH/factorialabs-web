name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (Angular 22 + SSR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FactoriaLabs.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/FactoriaLabs.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (SSR)
        run: npm run build
