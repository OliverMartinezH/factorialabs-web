name: factorialabs

# Un solo servicio: Angular SSR + API Express, con los leads en un volumen JSON.

services:
  factorialabs-web:
    build:
      context: ../src/FactoriaLabs.Web
      dockerfile: Dockerfile
    container_name: factorialabs-web
    environment:
      PORT: 4000
      NODE_ENV: production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,factorialabs-web}
    ports:
      - "4200:4000"
    volumes:
      - factorialabs-leads:/app/data
    restart: unless-stopped

volumes:
  factorialabs-leads:
