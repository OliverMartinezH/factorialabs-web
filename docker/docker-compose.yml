name: factorialabs

# Stack local sin base de datos: la API no persiste nada todavía.
# Cuando se necesite, se agrega el servicio factorialabs-db y su volumen.

services:
  factorialabs-api:
    build:
      context: ../src/FactoriaLabs.Api
      dockerfile: Dockerfile
    container_name: factorialabs-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5080:8080"
    volumes:
      - factorialabs-leads:/app/data
    restart: unless-stopped

  factorialabs-web:
    build:
      context: ../src/FactoriaLabs.Web
      dockerfile: Dockerfile
    container_name: factorialabs-web
    environment:
      PORT: 4000
      NODE_ENV: production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,factorialabs-web}
    ports:
      - "4200:4000"
    depends_on:
      - factorialabs-api
    restart: unless-stopped

volumes:
  factorialabs-leads:
